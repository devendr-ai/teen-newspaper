name: Build daily newspaper PDF

on:
  workflow_dispatch:
    inputs:
      content_file:
        description: "Content JSON filename at repository root"
        required: true
        default: "ygc_content_2026-10-10.json"
  push:
    paths:
      - "ygc_content_*.json"
      - "_template.py"
      - ".github/workflows/build-newspaper.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependencies
        run: python -m pip install --upgrade pip reportlab pypdf
      - name: Select content file
        id: content
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            FILE="${{ inputs.content_file }}"
          else
            FILE="$(git ls-files 'ygc_content_*.json' | sort | tail -n 1)"
          fi
          test -n "$FILE"
          test -f "$FILE"
          echo "file=$FILE" >> "$GITHUB_OUTPUT"
          DATE="$(printf '%s' "$FILE" | grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}' | tail -n 1)"
          if [ -z "$DATE" ]; then DATE="$(date -u +%Y-%m-%d)"; fi
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
      - name: Build PDF
        run: python _template.py "${{ steps.content.outputs.file }}" "Young_Global_Citizen_Daily_${{ steps.content.outputs.date }}.pdf"
      - name: Validate rendered PDF text
        run: |
          python - <<'PY'
          from pypdf import PdfReader
          path = "Young_Global_Citizen_Daily_${{ steps.content.outputs.date }}.pdf"
          reader = PdfReader(path)
          assert len(reader.pages) == 2, f"Expected 2 pages, got {len(reader.pages)}"
          text = "\\n".join(page.extract_text() or "" for page in reader.pages)
          for marker in ("[IMAGE:", "[CHART:", "[MAP:", "[PHOTO:", "…"):
              assert marker not in text, f"Found unfinished/truncated content marker: {marker}"
          print("PDF checks passed: 2 pages, no placeholders or ellipsis truncation.")
          PY
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: young-global-citizen-daily
          path: Young_Global_Citizen_Daily_*.pdf
          if-no-files-found: error
          retention-days: 30
