name: Build daily newspaper PDF

on:
  workflow_dispatch:
    inputs:
      content_file:
        description: "Content JSON filename at repository root"
        required: true
        default: "ygc_content_2026-10-10.json"
  push:
    paths:
      - "ygc_content_*.json"
      - "_template.py"
      - ".github/workflows/build-newspaper.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install --upgrade pip reportlab
      - name: Select content file
        id: content
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "file=${{ inputs.content_file }}" >> "$GITHUB_OUTPUT"
          else
            FILE="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^ygc_content_.*\.json$' | head -n 1)"
            if [ -z "$FILE" ]; then FILE="ygc_content_2026-10-10.json"; fi
            echo "file=$FILE" >> "$GITHUB_OUTPUT"
          fi
      - name: Build PDF
        run: python _template.py "${{ steps.content.outputs.file }}" "Young_Global_Citizen_Daily_$(date -u +%Y-%m-%d).pdf"
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: young-global-citizen-daily
          path: Young_Global_Citizen_Daily_*.pdf
          if-no-files-found: error
          retention-days: 30
